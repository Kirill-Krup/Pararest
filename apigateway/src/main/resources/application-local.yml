spring:
  config:
    activate:
      on-profile: local
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: authservice-public
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**, /v3/api-docs/auth
            - id: authservice-protected
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/logout
            - id: userservice-public
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/users/getInfo, /v3/api-docs/users
            - id: userservice-protected
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/users/**, /api/v1/profile/**
            - id: menuservice-protected
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/menu/**, /api/v1/categories/**, /v3/api-docs/menu
            - id: inventory-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/ingredients/**, /api/v1/recipes/**, /api/v1/suppliers/**, /api/v1/supplies/**, /v3/api-docs/inventory
            - id: composite-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/v1/composite/**, /v3/api-docs/composite